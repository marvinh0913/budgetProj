name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: budgetproj
          POSTGRES_PASSWORD: budgetproj
          POSTGRES_DB: budgetproj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetproj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://budgetproj:budgetproj@localhost:5432/budgetproj_test
      JWT_SECRET: ci-only-not-a-real-secret
      FRED_API_KEY: not-used-in-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Apply migrations
        run: python -m scripts.migrate

      - name: Run tests
        run: python -m pytest
